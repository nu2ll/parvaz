  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3d0e0"/><stop offset="1" stop-color="#8fa3bd"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8e2ee"/><stop offset="1" stop-color="#aebdd0"/></linearGradient>
